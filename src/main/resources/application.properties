spring.application.name=usuarios

#spring.datasource.url=jdbc:mysql://localhost:3306/usuarios
#spring.datasource.username=root
#spring.datasource.password=12345678
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/usuarios}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:12345678}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
server.port=${PORT:8081}
