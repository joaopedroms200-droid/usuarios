<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <form id="userForm">
        <div class="form-group">
            <input type="radio" id="tipoLeitor" name="tipoPerfil" value="leitores" checked>
            <label for="tipoLeitor">Leitor</label>
            <input type="radio" id="tipoBiblio" name="tipoPerfil" value="bibliotecarios">
            <label for="tipoBiblio">Bibliotecário</label>
        </div>
        <div>
            <label>Nome:</label>
            <input type="text" id="name" required>
        </div>
        <div>
            <label>Email:</label>
            <input type="email" id="email" required>
        </div>
        <div>
            <label>Senha:</label>
            <input type="password" id="senha" required>
        </div>
        <button type="submit">Salvar no bd</button>
    </form>
    <button onclick="listarUsuarios()" style="background-color: #007bff;">Atualizar Lista</button>
    <ul id="listaUsuarios"></ul>
<script>
    //const BASE_URL = "http://localhost:8080/usuarios";
    const BASE_URL = "https://usuarios-production-0f38.up.railway.app/usuarios"
    document.addEventListener("DOMContentLoaded", () => {
        const form = document.getElementById("userForm");

        if (form) {
            form.addEventListener("submit", async (e) => {
                e.preventDefault();

                const rota = document.querySelector('input[name="tipoPerfil"]:checked').value;
                const urlDestino = `${BASE_URL}/${rota}`;

                const novoUsuario = {
                    name: document.getElementById("name").value,
                    email: document.getElementById("email").value,
                    senha: document.getElementById("senha").value
                };

                try {
                    const response = await fetch(urlDestino, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(novoUsuario)
                    });

                    if (response.ok) {
                        alert("Gravado com sucesso!");
                        form.reset(); 
                        listarUsuarios(rota);
                    } else {
                        alert("Erro ao salvar.");
                    }
                } catch (error) {
                    console.error("Erro:", error);
                    alert("Não foi possível conectar ao servidor Spring Boot.");
                }
            });
        }
        listarUsuarios('leitores');
    });

    async function listarUsuarios(tipo) {
        const rotaFinal = tipo || document.querySelector('input[name="tipoPerfil"]:checked').value;
        const urlConsulta = `${BASE_URL}/${rotaFinal}`;

        try {
            const response = await fetch(urlConsulta);
            const usuarios = await response.json();
            const ul = document.getElementById("listaUsuarios");
            if (ul) {
                ul.innerHTML = ""; 
                if (Array.isArray(usuarios)) {
                    usuarios.forEach(user => {
                        const li = document.createElement("li");
                        const idExibido = user.user_id || user.id_leitor || user.id_bibliotecario;
                        li.textContent = `ID: ${idExibido} | Nome: ${user.name} | Email: ${user.email}`;
                        ul.appendChild(li);
                    });
                }
            }
        } catch (error) {
            console.error("Erro ao listar:", error);
        }
    }
</script>
</body>
</html>
